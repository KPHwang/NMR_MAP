<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>NMR 사용자 위치 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #header { padding: 12px; background: #2c3e50; color: white; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        #header h2 { margin: 0; font-size: 18px; }
        
        .search-box { display: flex; gap: 5px; }
        .search-box input { padding: 6px 10px; font-size: 14px; width: 180px; border: none; border-radius: 4px; }
        .search-box button { padding: 6px 12px; font-size: 14px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        #map { width: 100%; height: calc(100vh - 60px); }
        .popup-box { font-size: 14px; line-height: 1.4; width: 240px; }
        .popup-box b { font-size: 15px; color: #2c3e50; }
        
        .copy-btn { margin-top: 6px; width: 100%; padding: 5px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .memo-area { width: 100%; height: 50px; margin-top: 6px; padding: 5px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; resize: none; box-sizing: border-box; }
        .save-memo-btn { margin-top: 4px; width: 100%; padding: 5px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; }
        
        #app { display: none; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f4f6f7; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .login-box input { padding: 10px; font-size: 15px; width: 200px; margin-right: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .login-box button { padding: 10px 15px; font-size: 15px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h3>🔒 보안 접속</h3>
            <p style="font-size: 13px; color: #666;">접속 비밀번호를 입력해주세요.</p>
            <input type="password" id="password-input" placeholder="비밀번호 입력">
            <button onclick="checkPassword()">확인</button>
        </div>
    </div>

    <div id="app">
        <div id="header">
            <h2>📍 NMR 실시간 공유 지도</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="기관명 또는 부서 입력">
                <button onclick="searchLocation()">검색</button>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var correctPassword = "jk5501"; // 비밀번호 설정
        
        // ★ SheetDB API 주소를 여기에 넣으세요
        var SHEET_API_URL = "https://sheetdb.io/api/v1/mmorvfgec91tr"; 

        function checkPassword() {
            var inputVal = document.getElementById('password-input').value;
            if (inputVal === correctPassword) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app').style.display = 'block';
                setTimeout(function() { map.invalidateSize(); }, 100);
                loadMapData();
            } else {
                alert("비밀번호가 틀렸습니다!");
                document.getElementById('password-input').value = "";
            }
        }

        document.getElementById('password-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { checkPassword(); }
        });

        var map = L.map('map').setView([36.3504, 127.3845], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var markers = [];

        function loadMapData() {
            fetch(SHEET_API_URL)
                .then(response => response.json())
                .then(locations => {
                    locations.forEach(function(loc, index) {
                        var lat = parseFloat(loc.위도);
                        var lng = parseFloat(loc.경도);
                        if (isNaN(lat) || isNaN(lng)) return;

                        var fullAddress = loc.주소 + (loc.상세주소 ? ' ' + loc.상세주소 : '');
                        var safeAddress = fullAddress.replace(/'/g, "\\'");
                        var deptInfo = loc.부서 && loc.부서 !== 'NaN' ? '(' + loc.부서 + ')' : '';
                        var currentMemo = loc.메모 && loc.메모 !== 'NaN' ? loc.메모 : "";

                        var popupContent = '<div class="popup-box">' +
                            '<b>' + loc.사용자 + '</b> ' + deptInfo + '<br>' +
                            '<span style="font-size:12px; color:#555;">' + fullAddress + '</span><br>' +
                            '<button class="copy-btn" onclick="copyAddress(\'' + safeAddress + '\', this)">📋 주소 복사하기</button>' +
                            '<textarea id="memo-' + index + '" class="memo-area" placeholder="특이사항 및 메모 입력...">' + currentMemo + '</textarea>' +
                            '<button class="save-memo-btn" onclick="saveMemo(\'' + loc.사용자 + '\', ' + index + ', this)">💾 실시간 메모 저장</button>' +
                            '</div>';

                        var marker = L.marker([lat, lng]).addTo(map).bindPopup(popupContent);
                        markers.push({ 
                            name: (loc.사용자 + ' ' + (loc.부서 || '')).toLowerCase(), 
                            marker: marker, 
                            lat: lat, 
                            lng: lng 
                        });
                    });
                })
                .catch(error => console.error('데이터 로드 실패:', error));
        }

        function saveMemo(userName, index, btnElement) {
            var memoText = document.getElementById('memo-' + index).value;

            fetch(SHEET_API_URL + '/사용자/' + encodeURIComponent(userName), {
                method: 'PUT',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    data: { '메모': memoText }
                })
            }).then(response => response.json())
              .then(data => {
                  showSuccess(btnElement, "✨ 실시간 공유 완료!", "#28a745");
              }).catch(error => {
                  alert("저장에 실패했습니다.");
              });
        }

        function copyAddress(addressText, btnElement) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(addressText).then(function() {
                    showSuccess(btnElement, "📋 주소 복사 완료!", "#007bff");
                }).catch(function() { fallbackCopy(addressText, btnElement); });
            } else { fallbackCopy(addressText, btnElement); }
        }

        function fallbackCopy(text, btnElement) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                if (document.execCommand('copy')) { showSuccess(btnElement, "📋 주소 복사 완료!", "#007bff"); }
                else { alert("복사에 실패했습니다."); }
            } catch (err) { alert("복사를 지원하지 않는 환경입니다."); }
            document.body.removeChild(textArea);
        }

        function showSuccess(btnElement, message, successColor) {
            var originalText = btnElement.innerText;
            var originalBg = btnElement.style.backgroundColor;
            btnElement.innerText = message;
            btnElement.style.backgroundColor = successColor;
            setTimeout(function() {
                btnElement.innerText = originalText;
                btnElement.style.backgroundColor = originalBg;
            }, 1500);
        }

        function searchLocation() {
            var keyword = document.getElementById('search-input').value.trim().toLowerCase();
            if (!keyword) { alert("검색할 기관명 또는 부서를 입력해주세요."); return; }
            var found = markers.find(function(item) { return item.name.includes(keyword); });
            if (found) {
                map.setView([found.lat, found.lng], 16);
                found.marker.openPopup();
            } else {
                alert("일치하는 기관을 찾을 수 없습니다.");
            }
        }

        document.getElementById('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { searchLocation(); }
        });
    </script>
</body>
</html>
