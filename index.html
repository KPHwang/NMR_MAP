        function copyAddress(addressText, btnElement) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(addressText).then(function() {
                    showSuccess(btnElement);
                }).catch(function() { fallbackCopy(addressText, btnElement); });
            } else { fallbackCopy(addressText, btnElement); }
        }

        function fallbackCopy(text, btnElement) {
            var textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                if (document.execCommand('copy')) { showSuccess(btnElement); }
                else { alert("복사에 실패했습니다."); }
            } catch (err) { alert("복사를 지원하지 않는 환경입니다."); }
            document.body.removeChild(textArea);
        }

        function showSuccess(btnElement) {
            var originalText = btnElement.innerText;
            btnElement.innerText = "✨ 주소 복사 완료!";
            btnElement.style.backgroundColor = "#28a745";
            setTimeout(function() {
                btnElement.innerText = originalText;
                btnElement.style.backgroundColor = "#007bff";
            }, 1500);
        }

        locations.forEach(function(loc) {
            var safeAddress = loc.address.replace(/'/g, "\\'");
            var popupContent = '<div class="popup-box">' +
                '<b>' + loc.name + '</b><br>' +
                '<span style="font-size:12px; color:#555;">' + loc.address + '</span><br>' +
                '<button class="copy-btn" onclick="copyAddress(\'' + safeAddress + '\', this)">📋 주소 복사하기</button>' +
                '</div>';
            L.marker([loc.lat, loc.lng]).addTo(map).bindPopup(popupContent);
        });
